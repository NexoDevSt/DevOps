version: '3.8'

services:
  db-mysql:
    image: mysql:8.0
    container_name: mysql-server
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - innova-network
    restart: always

  back-despachos:
    image: ${DOCKERHUB_USERNAME}/back-despachos:latest
    container_name: back-despachos
    ports:
      - "8080:8080"
    environment:
      - DB_ENDPOINT=db-mysql
      - DB_PORT=3306
      - DB_NAME=despachos_db
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/despachos_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    depends_on:
      - db-mysql
    networks:
      - innova-network
    restart: always

  back-ventas:
    image: ${DOCKERHUB_USERNAME}/back-ventas:latest
    container_name: back-ventas
    ports:
      - "8081:8081"
    environment:
      - DB_ENDPOINT=db-mysql
      - DB_PORT=3306
      - DB_NAME=ventas_db
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/ventas_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    depends_on:
      - db-mysql
    networks:
      - innova-network
    restart: always

networks:
  innova-network:
    driver: bridge

volumes:
  mysql_data:
