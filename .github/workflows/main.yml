name: CI/CD Pipeline - Docker Hub & Compose Split

on:
  push:
    branches:
      - fix/backend_problems

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # COMPILAR Y CONSTRUIR DESPACHOS
      - name: Compilar Microservicio Despachos
        run: |
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Construir y Subir Imagen Despachos
        uses: docker/build-push-action@v4
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest

      # COMPILAR Y CONSTRUIR VENTAS
      - name: Compilar Microservicio Ventas
        run: |
          cd back-Ventas_SpringBoot/Springboot-API-REST
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Construir y Subir Imagen Ventas
        uses: docker/build-push-action@v4
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/back-ventas:latest

      # CONSTRUIR Y SUBIR FRONTEND
      - name: Construir y Subir Imagen Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./front_despacho
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-innovatech:latest

  deploy-backend:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout para obtener los archivos Compose
        uses: actions/checkout@v3

      - name: Configurar llave SSH mediante Bastion
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config <<EOF
          Host bastion
            HostName ${{ secrets.IP_BASTION }}
            User ${{ secrets.VM_USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no

          Host backend
            HostName ${{ secrets.IP_BACKEND }}
            User ${{ secrets.VM_USER }}
            IdentityFile ~/.ssh/id_rsa
            ProxyJump bastion
            StrictHostKeyChecking no
          EOF

      - name: Copiar Docker Compose al Backend
        run: |
          scp docker-compose.backend.yml backend:~/docker-compose.yml

      - name: Desplegar Backend en AWS con Docker Compose
        run: |
          ssh backend << 'EOF'
            # Exportar variables para que Docker Compose las lea
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            
            # Limpiar puerto de MariaDB por si la máquina se reinició (prevención)
            sudo systemctl stop mariadb || true
            sudo systemctl disable mariadb || true
            
            # Detener lo anterior, descargar lo nuevo y encender
            sudo docker compose down || true
            sudo docker compose pull
            sudo docker compose up -d
            
            # Crear automáticamente las bases de datos si no existen
            echo "Esperando a que MySQL inicie..."
            sleep 15
            sudo docker exec mysql-server mysql -uroot -p${DB_PASSWORD} -e "CREATE DATABASE IF NOT EXISTS despachos_db; CREATE DATABASE IF NOT EXISTS ventas_db;"
          EOF

  deploy-frontend:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout para obtener los archivos Compose
        uses: actions/checkout@v3

      - name: Configurar llave SSH Directa al Frontend
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config <<EOF
          Host frontend
            HostName ${{ secrets.IP_FRONTEND }}
            User ${{ secrets.VM_USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
          EOF

      - name: Copiar Docker Compose al Frontend
        run: |
          scp docker-compose.frontend.yml frontend:~/docker-compose.yml

      - name: Desplegar Frontend en AWS con Docker Compose
        run: |
          ssh frontend << 'EOF'
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            
            # Detener contenedor anterior, descargar imagen fresca y levantar
            sudo docker compose down || true
            sudo docker compose pull
            sudo docker compose up -d
          EOF
