name: CI/CD Pipeline - Docker Hub & Compose Split

on:
  push:
    branches:
      - deploy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compilar Microservicio Despachos
        run: |
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Construir y Subir Imagen Despachos
        uses: docker/build-push-action@v4
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest

      - name: Compilar Microservicio Ventas
        run: |
          cd back-Ventas_SpringBoot/Springboot-API-REST
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Construir y Subir Imagen Ventas
        uses: docker/build-push-action@v4
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/back-ventas:latest

      - name: Construir y Subir Imagen Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./front_despacho
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-innovatech:latest

  deploy-backend:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Desplegar Backend
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "--- 1. Preparar Docker Compose ---"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=120 \
              -o ProxyCommand="ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -W %h:%p ${{ secrets.VM_USER }}@${{ secrets.IP_FRONTEND }}" \
              ${{ secrets.VM_USER }}@172.31.21.140 << 'EOF'
            sudo mkdir -p /usr/libexec/docker/cli-plugins
            sudo curl -sSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m) \
              -o /usr/libexec/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/libexec/docker/cli-plugins/docker-compose
          EOF

          echo "--- 2. Copiar Archivo Compose ---"
          cat docker-compose.backend.yml | ssh -o StrictHostKeyChecking=no \
              -o ProxyCommand="ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -W %h:%p ${{ secrets.VM_USER }}@${{ secrets.IP_FRONTEND }}" \
              ${{ secrets.VM_USER }}@172.31.21.140 "cat > ~/docker-compose.yml"

          echo "--- 3. Limpiar y Levantar Servicios ---"
          ssh -o StrictHostKeyChecking=no \
              -o ProxyCommand="ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -W %h:%p ${{ secrets.VM_USER }}@${{ secrets.IP_FRONTEND }}" \
              ${{ secrets.VM_USER }}@172.31.21.140 << 'EOF'
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"

            echo "Deteniendo y eliminando contenedores existentes..."
            sudo -E docker compose down --volumes --remove-orphans || true
            sudo docker rm -f mysql-server back-despachos back-ventas 2>/dev/null || true
            sudo docker network rm $(sudo docker network ls -q --filter name=innova-network) 2>/dev/null || true

            echo "Liberando caché del sistema..."
            sync && sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches'

            echo "Iniciando MySQL..."
            sudo -E docker compose up -d db-mysql

            echo "Esperando a que MySQL esté saludable..."
            until sudo docker inspect --format='{{.State.Health.Status}}' mysql-server 2>/dev/null | grep -q "healthy"; do
              echo "  MySQL aún no está listo, esperando 15s..."
              sleep 15
            done
            echo "MySQL listo."

            echo "Creando Bases de Datos..."
            sudo docker exec mysql-server mysql -uroot -p${DB_PASSWORD} \
              -e "CREATE DATABASE IF NOT EXISTS despachos_db; CREATE DATABASE IF NOT EXISTS ventas_db;"

            echo "Iniciando back-despachos..."
            sudo -E docker compose up -d back-despachos
            sleep 40

            echo "Iniciando back-ventas..."
            sudo -E docker compose up -d back-ventas
            sleep 30

            echo "Estado final:"
            sudo docker ps
            echo "Uso de memoria:"
            free -m
          EOF
          
  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configurar llave SSH Frontend
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Desplegar Frontend
        run: |
          # Inyectamos el archivo y ejecutamos comandos en un solo paso
          cat docker-compose.frontend.yml | ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.VM_USER }}@${{ secrets.IP_FRONTEND }} "cat > ~/docker-compose.yml"
          
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.VM_USER }}@${{ secrets.IP_FRONTEND }} << 'EOF'
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            sudo mkdir -p /usr/libexec/docker/cli-plugins
            sudo curl -sSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m) -o /usr/libexec/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/libexec/docker/cli-plugins/docker-compose
            
            sudo -E docker compose down || true
            sudo -E docker compose pull
            sudo -E docker compose up -d
          EOF
