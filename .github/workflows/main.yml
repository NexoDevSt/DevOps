name: CI/CD Pipeline - AWS ECR & ECS

on:
  push:
    branches:
      - feature/despliegue-ecs

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 429843885849.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push-ecr:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: despachos_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -prootpassword"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Preparar base de datos de test
        run: |
          mysql -h 127.0.0.1 -uroot -prootpassword \
            -e "CREATE DATABASE IF NOT EXISTS ventas_db;"

      - name: Test Back-Despachos
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/despachos_db?allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: rootpassword
        run: |
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          chmod +x mvnw
          ./mvnw test

      - name: Test Back-Ventas
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/ventas_db?allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: rootpassword
        run: |
          cd back-Ventas_SpringBoot/Springboot-API-REST
          chmod +x mvnw
          ./mvnw test

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compilar y Subir Back-Despachos
        env:
          ECR_REPOSITORY: microservice-despachos
        run: |
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          chmod +x mvnw
          ./mvnw clean package -DskipTests
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Compilar y Subir Back-Ventas
        env:
          ECR_REPOSITORY: microservice-ventas
        run: |
          cd back-Ventas_SpringBoot/Springboot-API-REST
          chmod +x mvnw
          ./mvnw clean package -DskipTests
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Construir y Subir Frontend
        env:
          ECR_REPOSITORY: frontend
        run: |
          cd front_despacho
          docker build \
            --build-arg VITE_API_DESPACHOS="http://${{ secrets.ALB_DNS }}:8080" \
            --build-arg VITE_API_VENTAS="http://${{ secrets.ALB_DNS }}:8081" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy-to-ecs:
    needs: build-and-push-ecr
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Descargar Task Definition de Despachos
        run: |
          aws ecs describe-task-definition --task-definition innovatech-backend-task \
            --query taskDefinition | jq 'del(.enableFaultInjection)' > task-def-despachos.json

      - name: Reemplazar imagen por microservice-despachos
        id: render-despachos
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-despachos.json
          container-name: backend-container
          image: ${{ env.ECR_REGISTRY }}/microservice-despachos:${{ env.IMAGE_TAG }}

      - name: Desplegar Despachos en ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-despachos.outputs.task-definition }}
          service: innovatech-service-back
          cluster: innovatech-cluster
          wait-for-service-stability: true

      - name: Descargar Task Definition de Ventas
        run: |
          aws ecs describe-task-definition --task-definition innovatech-ventas-task \
            --query taskDefinition | jq 'del(.enableFaultInjection)' > task-def-ventas.json

      - name: Reemplazar imagen por microservice-ventas
        id: render-ventas
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-ventas.json
          container-name: ventas-container
          image: ${{ env.ECR_REGISTRY }}/microservice-ventas:${{ env.IMAGE_TAG }}

      - name: Desplegar Ventas en ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-ventas.outputs.task-definition }}
          service: innovatech-service-ventas
          cluster: innovatech-cluster
          wait-for-service-stability: true

      - name: Descargar Task Definition de Frontend
        run: |
          aws ecs describe-task-definition --task-definition innovatech-frontend-task \
            --query taskDefinition | jq 'del(.enableFaultInjection)' > task-def-front.json

      - name: Reemplazar imagen por Frontend en ECR
        id: render-front
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-front.json
          container-name: frontend-container
          image: ${{ env.ECR_REGISTRY }}/frontend:${{ env.IMAGE_TAG }}

      - name: Desplegar Frontend en ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-front.outputs.task-definition }}
          service: innovatech-service-front
          cluster: innovatech-cluster
          wait-for-service-stability: true