name: CI/CD Pipeline - Docker Hub & Compose Split

on:
  push:
    branches:
      - fix/backend_problems

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compilar Microservicio Despachos
        run: |
          cd back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Construir y Subir Imagen Despachos
        uses: docker/build-push-action@v4
        with:
          context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest

      - name: Compilar Microservicio Ventas
        run: |
          cd back-Ventas_SpringBoot/Springboot-API-REST
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Construir y Subir Imagen Ventas
        uses: docker/build-push-action@v4
        with:
          context: ./back-Ventas_SpringBoot/Springboot-API-REST
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/back-ventas:latest

      - name: Construir y Subir Imagen Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./front_despacho
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-innovatech:latest

  deploy-backend:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configurar SSH con ProxyJump (Red Interna)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config <<EOF
          Host frontend
            HostName ${{ secrets.IP_FRONTEND }}
            User ${{ secrets.VM_USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no

          Host backend
            HostName ${{ secrets.IP_BACKEND }}
            User ${{ secrets.VM_USER }}
            IdentityFile ~/.ssh/id_rsa
            ProxyJump frontend
            StrictHostKeyChecking no
            ConnectTimeout 120
            ConnectionAttempts 5
          EOF

      - name: Preparar y Desplegar Backend
        run: |
          # 1. Fase de Rescate: Crear SWAP e instalar Docker Compose
          ssh backend << 'EOF'
            if [ ! -f /swapfile ]; then
              echo "Creando Swap de 2GB para estabilidad..."
              sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
            fi
            sudo mkdir -p /usr/libexec/docker/cli-plugins
            sudo curl -sSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m) -o /usr/libexec/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/libexec/docker/cli-plugins/docker-compose
          EOF

          # 2. Copiar archivo inyectándolo por el túnel SSH (más seguro que scp)
          cat docker-compose.backend.yml | ssh backend "cat > ~/docker-compose.yml"

          # 3. Despliegue Escalonado para no saturar la CPU
          ssh backend << 'EOF'
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            
            sudo -E docker compose down || true
            sudo docker rm -f mysql-server || true
            
            echo "Descargando imágenes nuevas..."
            sudo -E docker compose pull
            
            echo "Iniciando MySQL..."
            sudo -E docker compose up -d mysql-server
            sleep 45
            
            echo "Levantando Microservicios Spring Boot..."
            sudo -E docker compose up -d
            
            echo "Configurando bases de datos..."
            sleep 20
            sudo docker exec mysql-server mysql -uroot -p${DB_PASSWORD} -e "CREATE DATABASE IF NOT EXISTS despachos_db; CREATE DATABASE IF NOT EXISTS ventas_db;"
          EOF
          
  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configurar llave SSH Frontend
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Desplegar Frontend
        run: |
          # Inyectamos el archivo y ejecutamos comandos en un solo paso
          cat docker-compose.frontend.yml | ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.VM_USER }}@${{ secrets.IP_FRONTEND }} "cat > ~/docker-compose.yml"
          
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.VM_USER }}@${{ secrets.IP_FRONTEND }} << 'EOF'
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            sudo mkdir -p /usr/libexec/docker/cli-plugins
            sudo curl -sSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m) -o /usr/libexec/docker/cli-plugins/docker-compose
            sudo chmod +x /usr/libexec/docker/cli-plugins/docker-compose
            
            sudo -E docker compose down || true
            sudo -E docker compose pull
            sudo -E docker compose up -d
          EOF
