name: Deploy to AWS EC2 (Front & Back)

on:
  push:
    branches:
      - deploy

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP_FRONTEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          use_insecure_cipher: true
          script: |
            echo "--- Desplegando Frontend ---"
            mkdir -p ~/front_despacho
            cd ~/front_despacho
            if [ ! -d .git ]; then
              git clone -b deploy https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              git pull origin deploy
            fi
            echo "Frontend desplegado OK"

  deploy-backend:
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Backend via Bastion
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.IP_BACKEND }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          use_insecure_cipher: true
          proxy_host: ${{ secrets.IP_FRONTEND }}
          proxy_username: ${{ secrets.EC2_USER }}
          proxy_key: ${{ secrets.AWS_SSH_KEY }}
          proxy_use_insecure_cipher: true
          script: |
            echo "--- Desplegando Backend ---"

            # Microservicio Despachos
            mkdir -p ~/back-Despachos_SpringBoot
            cd ~/back-Despachos_SpringBoot
            if [ ! -d .git ]; then
              git clone -b deploy https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              git pull origin deploy
            fi
            echo "Back Despachos OK"

            # Microservicio Ventas
            mkdir -p ~/back-Ventas_SpringBoot
            cd ~/back-Ventas_SpringBoot
            if [ ! -d .git ]; then
              git clone -b deploy https://${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              git pull origin deploy
            fi
            echo "Back Ventas OK"