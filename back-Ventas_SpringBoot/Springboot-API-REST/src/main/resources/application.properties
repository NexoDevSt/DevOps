# El formato ${VARIABLE:defecto} busca la variable del sistema. Si no existe, usa lo que está después de los dos puntos.
spring.datasource.url=jdbc:mysql://${DB_ENDPOINT:localhost}:${DB_PORT:3306}/${DB_NAME:base_datos_local}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:tu_password_local_de_arch}

# Esto le dice a Hibernate que cree las tablas automáticamente si no existen en la EC2
spring.jpa.hibernate.ddl-auto=update
server.port=8081